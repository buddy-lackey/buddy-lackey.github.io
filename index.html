<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alef-93</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #05070a;
      font-family: Consolas, "Courier New", monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Main content */
    .container {
      text-align: center;
    }

    /* Main image */
    .main-image {
      display: block;
      max-width: 90vw;
      max-height: 75vh;
      object-fit: contain;

      filter:
        drop-shadow(0 0 20px rgba(0, 255, 170, 0.10))
        drop-shadow(0 0 45px rgba(0, 255, 170, 0.05));
    }

    /* System status */
    .system-status {
      margin-top: 24px;

      color: #00e89d;
      font-size: 12px;
      letter-spacing: 3px;

      opacity: 0.65;

      user-select: none;
    }

    .status-dot {
      display: inline-block;

      width: 6px;
      height: 6px;

      margin-right: 8px;

      border-radius: 50%;

      background: #00e89d;

      box-shadow:
        0 0 5px rgba(0, 232, 157, 0.8),
        0 0 10px rgba(0, 232, 157, 0.4);
    }

    /* Blinking terminal cursor */
    .cursor {
      margin-left: 3px;

      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* QR challenge */
    #qr-container {
      position: fixed;

      right: 22px;
      bottom: 22px;

      padding: 8px;

      background: white;

      border-radius: 6px;

      opacity: 0.08;

      cursor: crosshair;

      transition:
        opacity 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;
    }

    #qr-container:hover {
      opacity: 1;

      transform: scale(1.04);

      box-shadow:
        0 0 12px #00e89d,
        0 0 30px rgba(0, 232, 157, 0.35);
    }

    /*
      Challenge 3

      There is something here that
      isn't quite as invisible as it looks.
    */

    .invisible-message {
      position: fixed;

      left: 10px;
      top: 10px;

      color: #05070a;

      font-size: 10px;

      user-select: text;
    }

    /* Mobile */
    @media (max-width: 600px) {

      .main-image {
        max-width: 92vw;
        max-height: 68vh;
      }

      #qr-container {
        right: 12px;
        bottom: 12px;
      }

      .system-status {
        font-size: 10px;
      }
    }

  </style>
</head>


<body>

  <div class="container">

    <img
      class="main-image"
      src="alef93.png"
      alt="Alef-93"
    >

    <div class="system-status">

      <span class="status-dot"></span>

      SYSTEM ONLINE<span class="cursor">_</span>

    </div>

  </div>


  <!--

  <div class="invisible-message">

  <div id="qr-container">
    <div id="qrcode"></div>
  </div>


  <!-- QR generator -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>


  <script>

      `,
      "color:#00e89d"
    );


    /*
      Challenge 4?

      Encoding != Encryption
    */


    /* QR CODE */

    new QRCode(
      document.getElementById("qrcode"),
      {
        text: "FLAG{qr_codes_are_data_too}",

        width: 105,
        height: 105,

        colorDark: "#050505",
        colorLight: "#ffffff",

        correctLevel: QRCode.CorrectLevel.H
      }
    );


    /*
      BONUS CHALLENGE

      Sometimes keyboards have
      forgotten keys.
    */

    const secret = [
      97,
      108,
      101,
      102,
      57,
      51
    ];


    document.addEventListener(
      "keydown",
      function(event) {

        //if (event.key === "`") {
        if (event.key === "p") {

          console.log(
            "%cBONUS UNLOCKED: " +
            String.fromCharCode(...secret),

            "color:#ff3ca6;" +
            "font-size:20px;" +
            "font-weight:bold"
          );

        }

      }
    );

  </script>

</body>
</html>
