<!DOCTYPE html>

    html, body {

      width: 100%;

      background: #05070a;

    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

    /* Huvudbilden */
    .main-image {
      max-width: 94vw;
      max-height: 94vh;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0,255,170,0.12));
    }

    /* QR-kod */
    #qr-container {
      position: fixed;
      right: 24px;
      bottom: 24px;

      padding: 10px;

      background: white;
      border-radius: 8px;

      opacity: 0.13;
      transition: 0.3s;

      cursor: crosshair;
    }

    #qr-container:hover {
      opacity: 1;
      box-shadow:
        0 0 15px #00ffaa,
        0 0 35px rgba(0,255,170,0.5);
    }

    /* Något finns här... */
    .invisible-message {

</head>
